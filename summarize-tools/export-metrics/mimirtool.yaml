### mimirtool.yaml
apiVersion: v1
kind: Pod
metadata:
  name: mimirtool
  # Namespace is intentionally omitted so callers can place the helper pod in
  # whichever namespace hosts Prometheus, via `kubectl apply -n <namespace>`.
  labels:
    app: mimirtool
spec:
  containers:
  - name: mimirtool
    image: grafana/mimirtool:2.17.0
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "Mimirtool pod is running. Use 'kubectl exec' to run commands."
      # Keep the container running
      while true; do
        sleep 30
      done